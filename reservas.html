  <main class="form-container">
    <h2>Reservar Veículo</h2>
    <form action="confirmacao.html" method="post">
      <label for="cliente">Nome do Cliente:</label>
      <input type="text" id="cliente" name="cliente" required />

      <label for="veiculo">Veículo:</label>
      <select id="veiculo" name="veiculo" required>
        <option value="">Selecione</option>
        <option value="Fiat Argo">Fiat Argo</option>
        <option value="Chevrolet Onix">Chevrolet Onix</option>
      </select>

      <label for="retirada">Data de Retirada:</label>
      <input type="date" id="retirada" name="retirada" required />

      <label for="devolucao">Data de Devolução:</label>
      <input type="date" id="devolucao" name="devolucao" required />

      <button type="submit">Confirmar Reserva</button>
    </form>
  </main>
